# =============================================================
# docker-compose.yml
#
# Entorno base del proyecto + almacenamiento de objetos para T5.
# MinIO implementa la capa de objetos del lago local.
# =============================================================

services:
  jupyter:
    image: quay.io/jupyter/scipy-notebook@sha256:68f680024e25e9e433fa796f5adb41afd4907f1f97cb6c585c8432c60d244de1
    container_name: ideam_jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?falta en .env, ejecute 'cp .env.example .env'}"
      POSTGRES_USER: "${POSTGRES_USER:?falta en .env, ejecute 'cp .env.example .env'}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta en .env, ejecute 'cp .env.example .env'}"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - ./data:/home/jovyan/work/data
      - ./sql:/home/jovyan/work/sql
      - ./docs:/home/jovyan/work/docs
      - ./requirements.txt:/tmp/requirements.txt:ro
    working_dir: /home/jovyan/work
    command: >
      bash -c "pip install --quiet --no-cache-dir -r /tmp/requirements.txt &&
               start-notebook.py --IdentityProvider.token=''"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: ideam_db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?falta en .env, ejecute 'cp .env.example .env'}"
      POSTGRES_USER: "${POSTGRES_USER:?falta en .env, ejecute 'cp .env.example .env'}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta en .env, ejecute 'cp .env.example .env'}"
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -----------------------------------------------------------
  # T5 · Lago de objetos
  # -----------------------------------------------------------
  minio:
    # Anclado por digest, no por etiqueta RELEASE.*: MinIO retira del
    # registro publico las versiones que van quedando viejas, y la
    # etiqueta que estaba aqui (RELEASE.2024-06-13T19-44-58Z) ya no
    # existe en Docker Hub. Un digest no puede desaparecer asi.
    # Etiqueta legible, solo como referencia: RELEASE.2025-09-07T16-13-09Z
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ideam_minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  minio_data:
